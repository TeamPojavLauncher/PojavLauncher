name: Aerix Nightly (testing)

# Builds the APK that all testing happens on - Aerix Nightly - and attaches it to the
# `debug-latest` GitHub Release (prerelease, so `releases/latest` stays on the public stable
# release). The only APK on that tag is Aerix-Nightly.apk; older debug-named assets are removed on
# every publish, so there is one testing build to download.
# This workflow only ever builds the "noruntimeNightly" variant: same applicationId
# (net.al.aerixlauncher.debug), same debug signing key and same monotonic versionCode as the old
# debug APK, only the launcher label differs - so it installs straight over an existing debug
# install and keeps its data, while never being able to overwrite a release APK.
# Public releases are built by release.yml, which only runs after a typed confirmation.

on:
  push:
    branches: [ "v3_openjdk", "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: aerix-debug
  cancel-in-progress: true

env:
  # One APK for every phone: the testing build carries both ARM architectures, so it installs
  # anywhere without a second file to choose between.
  APK_NAME: Aerix-Nightly.apk
  APK_PATH: app_pojavlauncher/build/outputs/apk/noruntime/nightly/app_pojavlauncher-noruntime-nightly.apk

jobs:
  build:
    # Pin the desktop test runner to the Ubuntu image used by Fabric's 26.3 client-test workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the cape bridge against Minecraft fixtures
        run: |
          set +e
          python3 tests/modern_cape_smoke.py > "$RUNNER_TEMP/cape.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            # Annotations are the only part of a red job that survives to the API, so the reason the
            # bridge gave up has to be in one - not forty lines of log nobody scrolls.
            echo "::error title=Cape bridge smoke::$(tr '\n' '|' < "$RUNNER_TEMP/cape.log" | tail -c 1500)"
          fi
          tail -40 "$RUNNER_TEMP/cape.log"
          exit "$status"

      - name: Verify Client smoke tests
        run: |
          trap 'echo "::error title=Smoke test failed::$BASH_COMMAND"' ERR
          node --check app_pojavlauncher/src/main/assets/skinview/skinview.js
          python3 tests/branding_identity_smoke.py
          python3 tests/data_migration_smoke.py
          python3 tests/discord_presence_logo_smoke.py
          python3 tests/social_profile_cosmetics_smoke.py
          python3 tests/skin_preview_camera_smoke.py
          python3 tests/client_background_smoke.py
          python3 tests/instance_renderer_smoke.py
          python3 tests/renderer_defaults_smoke.py
          python3 tests/fastclient_assets_smoke.py
          python3 tests/fastclient_performance_download_test.py
          python3 tests/recorder_wiring_smoke.py
          python3 tests/game_surface_capture_smoke.py
          python3 tests/complaint_fixes_smoke.py
          python3 tests/mouse_cursor_recording_smoke.py
          python3 tests/authlib_263_smoke.py
          python3 tests/font_styles_smoke.py
          python3 tests/glass_launcher_ui_smoke.py
          python3 tests/controller_input_scroll_smoke.py
          python3 tests/max_refresh_rate_smoke.py
          python3 tests/background_display_smoke.py
          python3 tests/error_dialog_smoke.py
          python3 tests/startup_runtime_smoke.py
          python3 tests/release_signing_smoke.py
          python3 tests/previous_launch_log_smoke.py
          python3 tests/game_exit_relaunch_smoke.py
          python3 tests/rust_removed_smoke.py
          python3 tests/offline_username_smoke.py
          python3 tests/aerix_cloud_skin_smoke.py
          python3 tests/game_auth_token_logging_smoke.py
          node --experimental-strip-types tests/aerix_auth_edge_test.mjs
          python3 tests/aerix_auth_live_test.py
          python3 tests/aerix_account_setup_smoke.py
          python3 tests/world_invite_chat_smoke.py
          python3 tests/servers_ui_smoke.py
          python3 tests/modpacks_smoke.py
          python3 tests/modpack_archives_test.py
          python3 tests/cape_default_smoke.py
          python3 tests/layout_transparency_smoke.py
          python3 tests/fps_counter_smoke.py
          mkdir -p "$RUNNER_TEMP/aerix-migration-test"
          javac -d "$RUNNER_TEMP/aerix-migration-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/tasks/DataMigrationPolicy.java \
            tests/DataMigrationPolicySmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-migration-test" net.kdt.pojavlaunch.tasks.DataMigrationPolicySmokeTest
          python3 tests/resourcepack_wiring_smoke.py
          python3 tests/vulkan_driver_import_smoke.py
          if [[ "${{ contains(github.event.head_commit.message, '[pack-fixture]') }}" == "true" ]]; then
            AERIX_PACK_TEST_FILE="$RUNNER_TEMP/senpaider-animated.zip" python3 tests/senpaider_pack_diagnostics.py
          fi
          mkdir -p "$RUNNER_TEMP/aerix-pack-test"
          javac -cp app_pojavlauncher/libs/gson-2.8.6.jar -d "$RUNNER_TEMP/aerix-pack-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/resourcepack/ResourcePackOptimizer.java \
            tests/ResourcePackOptimizerSmokeTest.java
          java -Djava.awt.headless=true -cp "$RUNNER_TEMP/aerix-pack-test:app_pojavlauncher/libs/gson-2.8.6.jar" net.kdt.pojavlaunch.aerix.resourcepack.ResourcePackOptimizerSmokeTest "$RUNNER_TEMP/senpaider-animated.zip"
          mkdir -p "$RUNNER_TEMP/aerix-servers-test"
          javac -cp app_pojavlauncher/libs/gson-2.8.6.jar -d "$RUNNER_TEMP/aerix-servers-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/servers/ServerAddress.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/servers/ServerStatusClient.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/servers/ServerArtworkCatalog.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/servers/SrvLookup.java \
            tests/ServerStatusSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-servers-test:app_pojavlauncher/libs/gson-2.8.6.jar" net.kdt.pojavlaunch.aerix.servers.ServerStatusSmokeTest
          python3 tests/game_launch_handoff_smoke.py
          mkdir -p "$RUNNER_TEMP/aerix-launch-test"
          javac -d "$RUNNER_TEMP/aerix-launch-test" \
            tests/launch_android_stubs/android/content/Context.java \
            tests/launch_android_stubs/android/util/Log.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/lifecycle/LaunchDiagnostics.java \
            tests/LaunchDiagnosticsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-launch-test" LaunchDiagnosticsSmokeTest
          python3 tests/aerix_google_provider_live_test.py
          mkdir -p "$RUNNER_TEMP/aerix-kotlin"
          (cd "$RUNNER_TEMP/aerix-kotlin" && npm pack kotlin-compiler@2.2.10 --silent && tar -xzf kotlin-compiler-2.2.10.tgz --strip-components=1)
          "$RUNNER_TEMP/aerix-kotlin/bin/kotlinc" tests/skinserver_stubs/*.kt \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/bridge/AerixSkinServer.kt \
            tests/AerixSkinServerOfflineTest.kt -classpath app_pojavlauncher/libs/gson-2.8.6.jar \
            -d "$RUNNER_TEMP/aerix-skinserver-test.jar"
          java -cp "$RUNNER_TEMP/aerix-skinserver-test.jar:app_pojavlauncher/libs/gson-2.8.6.jar:$RUNNER_TEMP/aerix-kotlin/lib/kotlin-stdlib.jar" AerixSkinServerOfflineTestKt
          # Max-refresh-rate: the chooser is pure arithmetic, so it is checked on its own, and the
          # Android adapter is then executed against stub `android.*` classes so a real request path
          # (read modes -> pick -> write preferredDisplayModeId -> vote -> read back) is proven here
          # rather than only on a phone.
          "$RUNNER_TEMP/aerix-kotlin/bin/kotlinc" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/RefreshModeChoice.kt \
            tests/RefreshModeChoiceOfflineTest.kt -d "$RUNNER_TEMP/aerix-refresh-choice.jar"
          java -cp "$RUNNER_TEMP/aerix-refresh-choice.jar:$RUNNER_TEMP/aerix-kotlin/lib/kotlin-stdlib.jar" RefreshModeChoiceOfflineTestKt
          "$RUNNER_TEMP/aerix-kotlin/bin/kotlinc" tests/refresh_display_stubs/*.kt \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/RefreshModeChoice.kt \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/DisplayRefreshMode.kt \
            tests/DisplayRefreshModeAndroidTest.kt -d "$RUNNER_TEMP/aerix-refresh-adapter.jar"
          java -cp "$RUNNER_TEMP/aerix-refresh-adapter.jar:$RUNNER_TEMP/aerix-kotlin/lib/kotlin-stdlib.jar" DisplayRefreshModeAndroidTestKt
          mkdir -p "$RUNNER_TEMP/aerix-recorder-test"
          javac -d "$RUNNER_TEMP/aerix-recorder-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/recording/RecordingPaths.java \
            tests/RecordingPathsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-recorder-test" RecordingPathsSmokeTest
          mkdir -p "$RUNNER_TEMP/aerix-worldshare-test"
          javac -d "$RUNNER_TEMP/aerix-worldshare-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/worldshare/WorldSharePolicy.java \
            tests/WorldSharePolicySmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-worldshare-test" WorldSharePolicySmokeTest
          mkdir -p "$RUNNER_TEMP/aerix-memory-test"
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/customcontrols/ControlKeycodes.java \
            tests/ControlKeycodesSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ControlKeycodesSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/jre/InstanceMemory.java \
            tests/InstanceMemorySmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" InstanceMemorySmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientVersions.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/PackVersionFilter.java \
            tests/PackVersionFilterSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" PackVersionFilterSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientLogoMigration.java \
            tests/ClientLogoMigrationSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ClientLogoMigrationSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientVersions.java \
            tests/ClientVersionsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ClientVersionsSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientVersions.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientBootLabels.java \
            tests/ClientBootLabelsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ClientBootLabelsSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientVersionOptions.java \
            tests/ClientVersionOptionsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ClientVersionOptionsSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/ClientOptionLines.java \
            tests/ClientOptionLinesSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" ClientOptionLinesSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/game/FrameTimingStats.java \
            tests/FrameTimingStatsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" FrameTimingStatsSmokeTest
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror \
            -I app_pojavlauncher/src/main/jni/fps tests/frame_counter_smoke.c \
            app_pojavlauncher/src/main/jni/fps/frame_counter.c -o "$RUNNER_TEMP/aerix-frame-test"
          "$RUNNER_TEMP/aerix-frame-test"
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            aerix_client_mod/src/main/java/aerix/client/mod/ClientTelemetry.java tests/ModernTelemetrySmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" aerix.client.mod.ModernTelemetrySmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            aerix_client_mod/src/main/java/aerix/client/mod/ClientVisualOverrides.java \
            tests/ClientVisualOverridesSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" aerix.client.mod.ClientVisualOverridesSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/aerix/client/AdaptiveDistanceController.java \
            tests/AdaptiveDistanceSmokeTest.java \
            aerix_client_mod/src/main/java/aerix/client/mod/ClientAdaptiveDistance.java \
            tests/ClientAdaptiveDistanceSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" AdaptiveDistanceSmokeTest
          java -cp "$RUNNER_TEMP/aerix-memory-test" aerix.client.mod.ClientAdaptiveDistanceSmokeTest
          javac -d "$RUNNER_TEMP/aerix-memory-test" \
            aerix_client_mod/src/main/java/aerix/client/mod/ClientLiveOptions.java \
            tests/ClientLiveOptionsSmokeTest.java
          java -cp "$RUNNER_TEMP/aerix-memory-test" aerix.client.mod.ClientLiveOptionsSmokeTest

      - name: Live Minecraft authlib integration (temporary test identity)
        if: contains(github.event.head_commit.message, '[auth-fixture]')
        env:
          AERIX_TEST_NAME: AxAuthTest482
          AERIX_TEST_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: python3 tests/aerix_auth_server_integration.py

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK and the Aerix client mod JAR
        shell: bash
        run: |
          set +e
          ./gradlew :aerix_client_mod:jar :app_pojavlauncher:assembleNoruntimeNightly --console=plain > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            # One compressed annotation avoids GitHub's ten-annotations-per-step limit
            # and preserves compiler diagnostics even when the remote log host is blocked.
            tail -200 build.log | gzip -9c | base64 -w0 | fold -w 3500 |
              while IFS= read -r chunk || [ -n "$chunk" ]; do echo "::error title=build-log-gzip-base64::$chunk"; done
          fi
          exit "$code"

      - name: Check it is really the Aerix Nightly build
        id: verify
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          python3 tests/launcher_apk_verify.py "$APK_PATH"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT_DIR="$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BT_DIR"
          "$BT_DIR/zipalign" -c 4 "$APK_PATH"
          "$BT_DIR/apksigner" verify --verbose --min-sdk-version 23 --print-certs "$APK_PATH" | tee apksigner.txt
          BADGING_ALL="$("$BT_DIR/aapt2" dump badging "$APK_PATH")"
          BADGING="$(printf '%s' "$BADGING_ALL" | head -n 1)"
          echo "$BADGING"
          [[ "$BADGING" == "package: name='net.al.aerixlauncher.debug' "* ]]
          echo "applicationId net.al.aerixlauncher.debug confirmed"
          VCODE="$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "::notice title=apk-verified::$BADGING"

      - name: Upload Aerix Nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: aerix-nightly-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Publish Aerix Nightly to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag stays debug-latest so the prerelease keeps its anchored position, but every
          # APK on it is Aerix Nightly. Non-release updates and testing all land here.
          TAG="debug-latest"
          INFO_NAME="NIGHTLY_BUILD.txt"
          SHORT="${GITHUB_SHA:0:7}"
          STAMPED_NAME="Aerix-Nightly-$SHORT.apk"
          BUILT_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          STAGE="$(mktemp -d)"
          cp "$APK_PATH" "$STAGE/$APK_NAME"
          cp "$APK_PATH" "$STAGE/$STAMPED_NAME"
          ( cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          SHA256="$(cut -d' ' -f1 "$STAGE/$APK_NAME.sha256")"
          {
            echo "kind: Aerix Nightly (testing only)"
            echo "name: $APK_NAME (universal, arm64 + arm32)"
            echo "stamped: $STAMPED_NAME"
            echo "branch: $GITHUB_REF_NAME"
            echo "commit: $GITHUB_SHA"
            echo "versionCode: $VERSION_CODE"
            echo "run: $GITHUB_RUN_ID"
            echo "built: $BUILT_AT"
            echo "sha256: $SHA256"
            echo "package: net.al.aerixlauncher.debug"
            echo "note: side-by-side testing build; public stable releases live under v* tags"
          } > "$STAGE/$INFO_NAME"
          {
            echo "Side-by-side testing build (\`net.al.aerixlauncher.debug\`) — installs next to the public launcher without touching its data."
            echo ""
            echo "- **Direct download:** [\`$APK_NAME\`](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME)"
            echo "- **Commit-stamped download (avoids browser filename cache):** [\`$STAMPED_NAME\`](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$STAMPED_NAME)"
            echo "- **Branch:** \`$GITHUB_REF_NAME\`"
            echo "- **Commit:** \`$SHORT\` (\`$GITHUB_SHA\`)"
            echo "- **versionCode:** \`$VERSION_CODE\`"
            echo "- **Built:** \`$BUILT_AT\`"
            echo "- **SHA-256:** \`$SHA256\`"
            echo "- **Package / signing:** \`net.al.aerixlauncher.debug\`, \`app_pojavlauncher/debug.keystore\`"
            echo ""
            echo "All non-release updates and testing happen on this APK. Stable builds stay under the \`v*\` releases."
          } > "$STAGE/RELEASE_NOTES.md"

          # Anchor the tag ref to the root 2020 keystore commit so GitHub's /releases list
          # always sorts this prerelease below every public v* release and never touches the website.
          ANCHOR_SHA="cadb0ab12ff45b582927361b703df878b37e0221"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Keep only the current nightly pair. Old debug downloads and older stamped nightlies
            # are removed, so every link on this release points at the newest testing build.
            for old_asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              case "$old_asset" in
                "$APK_NAME"|"$STAMPED_NAME"|"$APK_NAME.sha256"|"$INFO_NAME") ;;
                Aerix-Launcher-debug*|Aerix-Nightly-*.apk|DEBUG_BUILD.txt) gh release delete-asset "$TAG" "$old_asset" --yes || true ;;
                *) ;;
              esac
            done
            gh release upload "$TAG" --clobber \
              "$STAGE/$APK_NAME" \
              "$STAGE/$STAMPED_NAME" \
              "$STAGE/$APK_NAME.sha256" \
              "$STAGE/$INFO_NAME"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$ANCHOR_SHA" -F force=true > /dev/null 2>&1 || true
            gh release edit "$TAG" \
              --prerelease \
              --title "Aerix Nightly (latest)" \
              --notes-file "$STAGE/RELEASE_NOTES.md"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$ANCHOR_SHA" > /dev/null 2>&1 || true
            gh release create "$TAG" \
              --prerelease \
              --title "Aerix Nightly (latest)" \
              --notes-file "$STAGE/RELEASE_NOTES.md" \
              "$STAGE/$APK_NAME" \
              "$STAGE/$STAMPED_NAME" \
              "$STAGE/$APK_NAME.sha256" \
              "$STAGE/$INFO_NAME"
          fi
          rm -rf "$STAGE"
          echo "::notice title=aerix-nightly::https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME (versionCode $VERSION_CODE, from $SHORT)"
