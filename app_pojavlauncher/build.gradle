plugins {
    id 'com.android.application' version '8.11.1'
    id 'org.jetbrains.kotlin.android' version '2.2.10'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
    id 'de.undercouch.download' version '5.6.0'
    id 'org.ajoberstar.grgit' version '5.3.2'
}

apply from: rootProject.file('gradle/prefab_bypass.gradle')

import de.undercouch.gradle.tasks.download.Download

static def getDate() { return new Date().format('yyyyMMdd') }

static def getDateSeconds() {
    if (System.getenv("GITHUB_ACTIONS") == "true") {
        return Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER"))
    } else {
        return 172005
    }
}

// One version source: the APK, About page and updater all read this same value.
def aerixVersion = new Properties()
rootProject.file('version.properties').withInputStream { aerixVersion.load(it) }
def AERIX_VERSION_NAME = aerixVersion.getProperty('versionName')
if (!(AERIX_VERSION_NAME ==~ /\d+\.\d+\.\d+/)) throw new GradleException('versionName must be major.minor.patch')
def versionParts = AERIX_VERSION_NAME.split('\\.').collect { it.toInteger() }
if (versionParts[1] >= 100 || versionParts[2] >= 100) throw new GradleException('Minor/patch must be below 100')
def AERIX_VERSION_CODE = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
// Debug testing APKs advance monotonically on every build so installing a new debug APK over an
// existing net.al.aerixlauncher.debug install never fails with
// INSTALL_FAILED_VERSION_DOWNGRADE ("App not installed as package appears to be invalid").
def AERIX_DEBUG_VERSION_CODE = ((long) (System.currentTimeMillis() / 1000L) - 1700000000L).toInteger()

def getVersionName = {
    def currentBranch = grgit.branch.current()
    def latestCommit = grgit.log(maxCommits: 1)
    def dateToday = getDate()
    if(currentBranch == null || latestCommit == null) {
        return "LOCAL-${dateToday}"
    }else {
        def branchName = currentBranch.getName()
        def commitAbbreviation = latestCommit.abbreviatedId
        return "pojav-legacy-${dateToday}-${commitAbbreviation}-${branchName}"
    }
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY")
    if(key != null && !key.trim().isEmpty()) return key.trim()
    File curseforgeKeyFile = new File("./curseforge_key.txt")
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text.trim()
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !')
    return "DUMMY"
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    sourceSets {
        main {
        }
    }

    compileSdk = 36

    lintOptions {
        abortOnError false
    }

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Inherited from upstream, whose keystores are no longer kept in this repository. Left
        // configurable for a builder who holds the upstream key; nothing in Aerix CI references it.
        customRelease {
            // Upstream's key, kept in the tree because its password is NOT: without
            // POJAV_KEYSTORE_PASSWORD these builds simply go unsigned. Only aerixRelease below is a key
            // whose password was public, and that is why that one left the repository.
            storeFile file("pojav_release.jks")
            storePassword System.getenv("POJAV_KEYSTORE_PASSWORD")
            keyAlias "android_github_release"
            keyPassword System.getenv("POJAV_KEYSTORE_PASSWORD")
        }
        // The key the published Aerix builds are signed with. It is NOT in this repository, and it
        // must never be: a release key that travels with the project is a release key anyone can
        // use, and whoever holds it can push an update that every installed copy accepts as ours -
        // same package, same signature, any code inside. The line that used to fall back to a
        // password written down in this file is what let a public key sign public releases.
        //
        // Release CI decodes AERIX_KEYSTORE_P12 into RUNNER_TEMP and exports AERIX_KEYSTORE_FILE and
        // AERIX_KEYSTORE_PASSWORD (see .github/workflows/release.yml). A local release build without
        // them goes unsigned instead: assembleRelease still compiles, and that APK is for looking at,
        // never for publishing. The release workflow refuses to publish an unsigned APK, and refuses
        // one signed by the retired key, so forgetting the secret is loud rather than implicit.
        aerixRelease {
            def keyFile = System.getenv("AERIX_KEYSTORE_FILE")
            def keyPass = System.getenv("AERIX_KEYSTORE_PASSWORD")
            if (keyFile != null && keyPass != null && new File(keyFile).isFile()) {
                storeFile new File(keyFile)
                storeType "PKCS12"
                storePassword keyPass
                keyAlias System.getenv("AERIX_KEYSTORE_ALIAS") ?: "aerix"
                keyPassword keyPass
            } else {
                logger.warn("aerixRelease: no AERIX_KEYSTORE_FILE - the release APK will be UNSIGNED")
            }
        }
        googlePlayBuild {
            // Upstream's key, kept in the tree because its password is NOT: without
            // POJAV_GPLAY_KEYSTORE_PASSWORD these builds simply go unsigned. Only aerixRelease below is a key
            // whose password was public, and that is why that one left the repository.
            storeFile file("pojav_gplay.jks")
            storePassword System.getenv("POJAV_GPLAY_KEYSTORE_PASSWORD")
            keyAlias "key0"
            keyPassword System.getenv("POJAV_GPLAY_KEYSTORE_PASSWORD")
        }
        upload {
            // Upstream's key, kept in the tree because its password is NOT: without
            // UPLOAD_KEYSTORE_PASSWORD these builds simply go unsigned. Only aerixRelease below is a key
            // whose password was public, and that is why that one left the repository.
            storeFile file("pojav_upload.jks")
            storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
        }
        publicBuild {
            // Upstream's key, kept in the tree because its password is NOT: without
            // POJAVPUB_KEYSTORE_PASSWORD these builds simply go unsigned. Only aerixRelease below is a key
            // whose password was public, and that is why that one left the repository.
            storeFile file("pojav_pub.jks")
            storePassword System.getenv("POJAVPUB_KEYSTORE_PASSWORD")
            keyAlias "key0"
            keyPassword System.getenv("POJAVPUB_KEYSTORE_PASSWORD")
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    // Video wallpapers play straight from the APK, so they must not be compressed: a compressed
    // resource cannot be opened as a file descriptor, which is what the player needs.
    androidResources {
        noCompress 'webm', 'mp4'
    }

    defaultConfig {
        applicationId "net.al.aerixlauncher"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode AERIX_VERSION_CODE
        versionName AERIX_VERSION_NAME
        multiDexEnabled false //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
    }

    /*
     * One APK per CPU architecture, only when asked for with -PabiSplits. The release workflow asks.
     *
     * A phone only ever uses one of them, but a universal APK carries every set of native libraries
     * at once - which is most of the download. Splitting gives a 64-bit phone roughly half the file,
     * with nothing removed: the other build simply lives in another file.
     *
     * Only the two ARM builds are split, because those are the phones. The universal APK is always
     * produced as well: it is what the x86 devices fall back to, and what the in-app updater uses if
     * a release is ever missing a split.
     *
     * Opt-in rather than always on: the app bundle build does not accept split configuration, and
     * the debug APK stays a single universal file for testing.
     */
    if (project.hasProperty("abiSplits")) {
        splits {
            abi {
                enable true
                reset()
                include "armeabi-v7a", "arm64-v8a"
                universalApk true
            }
        }
    }

    flavorDimensions  = ["runtime"]
    
    productFlavors {
        full {
            dimension "runtime"
        }
        
        noruntime {
            dimension "runtime"
            versionNameSuffix "-noruntime"
        }
    }

    buildTypes {
        debug {
            // The testing APK is installed on ARM phones, and the renderer libs it now carries no
            // longer fit the 100 MiB a repository file may have when all four ABIs are inside it.
            // Only the two ARM ABIs are packaged here; release builds stay universal.
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "Aerix Launcher (Debug)"
            resValue "string", "app_short_name", "Aerix Launcher (Debug)"
            resValue "string", "aerix_app_label", "Aerix Launcher (Debug)"
            resValue 'string', 'application_package', 'net.al.aerixlauncher.debug'
            resValue 'string', 'storageProviderAuthorities', 'net.al.aerixlauncher.scoped.gamefolder.debug'
        }
        // Aerix Nightly is the testing channel. It keeps the debug applicationId, signing key and
        // versionCode, so it installs over an existing debug build and behaves exactly like it.
        // Only the launcher label changes.
        nightly {
            initWith debug
            signingConfig signingConfigs.customDebug
            matchingFallbacks += List.of("debug")
            resValue "string", "app_name", "Aerix Nightly"
            resValue "string", "app_short_name", "Aerix Nightly"
            resValue "string", "aerix_app_label", "Aerix Nightly"
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
            matchingFallbacks += List.of("debug")
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.aerixRelease
            resValue "string", "app_name", "Aerix Launcher"
            resValue "string", "app_short_name", "Aerix Launcher"
            resValue "string", "aerix_app_label", "Aerix Launcher"
            resValue 'string', 'application_package', 'net.al.aerixlauncher'
            resValue 'string', 'storageProviderAuthorities', 'net.al.aerixlauncher.scoped.gamefolder'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks += List.of("release")
        }
        pubRelease {
            initWith release
            signingConfig signingConfigs.customDebug // WIP, changeme
            applicationIdSuffix '.pub'
            resValue "string", "app_name", "Aerix Launcher (Nightly)"
            resValue "string", "app_short_name", "Aerix Launcher (Nightly)"
            resValue "string", "aerix_app_label", "Aerix Launcher (Nightly)"
            resValue 'string', 'application_package', 'net.al.aerixlauncher.pub'
            resValue 'string', 'storageProviderAuthorities', 'net.al.aerixlauncher.pub.scoped.gamefolder'
            matchingFallbacks += List.of("release")
        }
    }

    ndkVersion "29.0.14206865"

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        buildConfig true
        compose true
        aidl true
    }
}

androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(AERIX_DEBUG_VERSION_CODE)
        }
    }
    // Nightly shares the debug applicationId, so it needs the same monotonically increasing
    // versionCode. Otherwise installing it over a debug build would be a downgrade.
    onVariants(selector().withBuildType("nightly")) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(AERIX_DEBUG_VERSION_CODE)
        }
    }
}

class AssetTaskRegistrar {
    private Project project
    private Task mergeAssetsTask
    private File targetAssetsDir
    private String variantName
    private File targetDownloadDir
    private File projectJarDir

    AssetTaskRegistrar(Project project) {
        this.project = project

        targetDownloadDir = new File(project.projectDir, "build/intermediates/download_deps")
        projectJarDir = new File(project.projectDir, "build/intermediates/package_jar_deps")
        createDirectories targetDownloadDir
        createDirectories projectJarDir
    }

    def setVariant(variant) {
        variantName = variant.getName().capitalize()
        mergeAssetsTask = variant.getPreBuildProvider().get()

        targetAssetsDir = new File(project.projectDir, "build/intermediates/remote_asset_set/${variantName.toLowerCase()}/")
        createDirectories(targetAssetsDir)

        project.android.sourceSets[variant.getName()].assets.srcDirs += targetAssetsDir.absolutePath
    }

    static def createDirectories(File location) {
        if(!location.isDirectory() && !location.mkdirs())
            throw new RuntimeException("Failed to create directory "+location.getAbsolutePath())
    }

    static def writeVersion(File dir) {
        File versionFile = new File(dir, "version")
        versionFile.write(String.valueOf(new Date().getTime()))
    }

    private def assetDestination(String relativePath) {
        return new File(targetAssetsDir, relativePath)
    }

    private def onlineUnzipTask(String downloadUrl, String name, File targetExtractionDir) {
        createDirectories targetExtractionDir

        def downloadTarget = new File(targetDownloadDir, name)

        def dependencySuffix = "${name}${variantName}"
        def downloadTask = project.tasks.register("download${dependencySuffix}", Download) {
            src downloadUrl
            dest downloadTarget
            overwrite false
        }

        def unzipTask = project.tasks.register("unzip${dependencySuffix}", Copy) {
            from project.zipTree(downloadTarget)
            into targetExtractionDir
            dependsOn downloadTask
        }
        return unzipTask
    }

    def onlineZipDependency(String downloadUrl, String name, String relativePath) {
	    mergeAssetsTask.dependsOn(onlineUnzipTask downloadUrl, name, assetDestination(relativePath))
    }

    def projectJarDependency(Project project, String relativePath) {
        def assetTargetDir = assetDestination(relativePath)
        def jarTargetDir = new File(projectJarDir, relativePath)
        createDirectories assetTargetDir
        createDirectories jarTargetDir

        def copyTaskName = "copyProjectJar${jarTargetDir.getName()}${variantName}"
        def copyTask = project.tasks.register(copyTaskName, Copy) {
            from jarTargetDir
            into assetTargetDir
            // Nasty hack: explicitly reference project by name to force Gradle to configure it.
            // Makes jar task search below work properly for fresh configurations.
            dependsOn ":${project.name}:jar"
        }

        mergeAssetsTask.dependsOn copyTask

        project.tasks.withType(org.gradle.jvm.tasks.Jar.class).configureEach {
            it.destinationDirectory = jarTargetDir
            doLast {
                if(!it.didWork) return
                writeVersion jarTargetDir
            }
        }
    }

    def onlineJarDependency(String jarUrl, String jarProject, String dependency, String version, String suffix,  String relativePath) {
        File targetDir = assetDestination(relativePath)
        createDirectories targetDir
        def dependencySuffix = "${jarProject}${dependency}${variantName}"
        def downloadTask = project.tasks.register("download${dependencySuffix}", Download) {
            src String.format(jarUrl, jarProject, dependency, version, suffix)
            dest targetDir
            overwrite false
            doLast {
                if(!it.didWork) return
                writeVersion targetDir
            }
        }
        mergeAssetsTask.dependsOn(downloadTask)
    }

    def jreRuntimeDependency(int version, String relPath) {
        def jreUrl = "https://github.com/MojoLauncher/android-openjdk-build-multiarch/releases/download/rolling/jre%d-pojav.zip"
        onlineZipDependency(String.format(jreUrl, version), "ComponentRuntime$version", relPath)
    }
}

afterEvaluate {
    def registrar = new AssetTaskRegistrar(project)

    android.applicationVariants.configureEach { variant ->
        registrar.setVariant(variant)

        registrar.projectJarDependency project(":forge_installer"), "components/forge_installer"
        // The Client's in-game half (capes, live options, ZOOM, Server Boost) ships as an asset and is
        // copied into every managed instance by AerixClientModBridge before the game starts.
        registrar.projectJarDependency project(":aerix_client_mod"), "components/aerix_client_mod"
		if (variant.getName().toLowerCase().contains("full")) {
            registrar.jreRuntimeDependency 8, "components/jre"
        }
        
		def cacioJarUrl = "https://jitpack.io/com/github/MojoLauncher/%1\$s/%2\$s/%3\$s/%2\$s-%3\$s%4\$s.jar"

        registrar.onlineJarDependency cacioJarUrl, "caciocavallo", "cacio-shared", "-9ba6264d8c-1", "", "components/caciocavallo"
        registrar.onlineJarDependency cacioJarUrl, "caciocavallo", "cacio-androidnw", "-9ba6264d8c-1", "", "components/caciocavallo"

        registrar.onlineJarDependency cacioJarUrl, "caciocavallo17", "cacio-tta", "d4553e5689", "-jar-with-dependencies", "components/caciocavallo17"
    }
}

