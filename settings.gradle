pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

rootProject.name='PojavLauncher'
include ':app_pojavlauncher'

include ':forge_installer'
include ':NoBlocklist'
include ':MioLibPatcher'
include ':glfw:jni_bindings'
include ':mojoexec:jni_bindings'
include ':sdl:jni_bindings'
